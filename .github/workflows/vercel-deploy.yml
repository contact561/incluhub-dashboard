name: Deploy application to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Vercel deployment target
        required: true
        type: choice
        options:
          - preview
          - production
      confirm:
        description: Type DEPLOY to confirm the deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate required secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull and validate application environment
        run: |
          vercel env pull .env.vercel.local --yes --environment="${{ inputs.target }}" --token="${{ secrets.VERCEL_TOKEN }}"
          node --env-file=.env.vercel.local scripts/ci/validate-deployment-env.mjs "${{ inputs.target }}"

      - name: Pull preview environment
        if: ${{ inputs.target == 'preview' }}
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build preview
        if: ${{ inputs.target == 'preview' }}
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy preview
        if: ${{ inputs.target == 'preview' }}
        run: vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pull production environment
        if: ${{ inputs.target == 'production' }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production
        if: ${{ inputs.target == 'production' }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        if: ${{ inputs.target == 'production' }}
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
