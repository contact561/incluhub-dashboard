name: Deploy Supabase migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the Supabase secrets
        required: true
        type: choice
        options:
          - staging
          - production
      confirm:
        description: Type DEPLOY to confirm the migration push
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations to ${{ inputs.environment }}
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link target project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration state
        run: supabase migration list

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push
